<!DOCTYPE html>
<html lang="ms">
<head>
<script src="display-mode.js"></script>
<link rel="stylesheet" href="display-mode.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>WWCD OBS — MAIDA ESPORTS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:1920px;height:1080px;overflow:hidden;
  background:#000;
}

/* WWCD IMAGE — full screen */
#wwcdImg{
  position:absolute;inset:0;z-index:1;
  width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .6s ease;
  display:block;
}
#wwcdImg.show{opacity:1}

/* EMPTY STATE */
#empty{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:#07050f;
}
#empty.hide{display:none}
.es-text{
  font-family:'Courier New',monospace;font-size:20px;
  letter-spacing:.3em;color:rgba(255,255,255,.18);text-transform:uppercase
}
</style>
</head>
<body>

<!-- WWCD IMAGE -->
<img id="wwcdImg" src="" alt="">

<!-- EMPTY STATE -->
<div id="empty">
  <div class="es-text">🏆 Menunggu WWCD</div>
  <div class="es-text" style="font-size:14px">Pilih team di WWCD Tracker</div>
</div>

<script src="firebase_sync.js"></script>
<script>
function gdrive(url){
  if(!url) return url;
  var m=url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://lh3.googleusercontent.com/d/'+m[1];
  var m2=url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if(m2) return 'https://lh3.googleusercontent.com/d/'+m2[1];
  return url;
}

var currentName = null;

function applyWWCD(w){
  var img   = document.getElementById('wwcdImg');
  var empty = document.getElementById('empty');

  if(!w || !w.name){
    img.classList.remove('show');
    empty.classList.remove('hide');
    currentName = null;
    return;
  }

  // Determine which image to show:
  // 1. wwcdImg (per-team WWCD image) — priority
  // 2. poster (background poster) — fallback
  var imageUrl = (w.wwcdImg && w.wwcdImg.trim()) ? gdrive(w.wwcdImg) : (w.poster ? gdrive(w.poster) : '');

  if(!imageUrl){
    img.classList.remove('show');
    empty.classList.remove('hide');
    return;
  }

  empty.classList.add('hide');
  img.src = imageUrl;
  img.onload = function(){ img.classList.add('show'); };
  img.onerror = function(){ img.classList.remove('show'); empty.classList.remove('hide'); };
  currentName = w.name;
}

window.addEventListener('load', function(){
  function trySync(){
    if(typeof fsGet !== 'function'){ setTimeout(trySync, 300); return; }
    fsGet('maida/wwcd', applyWWCD);
    if(typeof fsListen==='function'){
      fsListen('maida/wwcd', applyWWCD, 1);
    }
  }
  trySync();
});
</script>
</body>
</html>
